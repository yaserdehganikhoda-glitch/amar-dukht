<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه آمار دوخت - آفلاین</title>
    <meta name="theme-color" content="#4f46e5">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            padding: 24px;
        }
        .card {
            max-width: 380px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #f1f5f9;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6366f1, #4338ca);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 30px; height: 30px; }
        h1 { font-size: 17px; margin: 0 0 8px; }
        p { font-size: 13px; color: #64748b; line-height: 1.9; margin: 0 0 20px; }
        button {
            font-family: inherit;
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22M9 9a3 3 0 0 0 4.24 4.24M12 5c4 0 7.33 2.33 9 5-1.14 1.84-2.87 3.18-4.75 4M6.61 6.61C4.4 8.04 2.86 9.83 2 11c1.67 2.67 5 5 10 5 1.23 0 2.36-.14 3.39-.4"></path>
            </svg>
        </div>
        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>
            به نظر می‌رسد آفلاین هستید. نگران نباشید — داده‌های ثبت‌شده در همین دستگاه ذخیره هستند.
            اگر پیش‌تر یک‌بار برنامه را باز کرده باشید، با اتصال دوباره یا تلاش مجدد، نسخه‌ی ذخیره‌شده بارگذاری می‌شود.
        </p>
        <button onclick="window.location.href='./index.html'">تلاش مجدد</button>
    </div>
</body>
</html>
