name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Prepare Cordova Project Structure
      run: |
        npm install -g cordova
        cordova create cordova_app com.sewing.amar_dukht "amar-dukht"
        rm -rf cordova_app/www/*
        cp -r index.html manifest.json sw.js icon-*.png cordova_app/www/ 2>/dev/null || true
        cp -r www/* cordova_app/www/ 2>/dev/null || true

    - name: Build Android APK
      run: |
        cd cordova_app
        cordova platform add android@12.0.0
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SewingApp-APK
        path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
